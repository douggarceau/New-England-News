name: Story share pages
# Builds a share page and preview card for every story so links posted to
# Facebook, X or texts show the story itself. Runs on GitHub, not Claude.
on:
  push:
    branches: [main]
    paths: [index.html, "data/**", tools/share_pages.py, tools/banned_words.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: share-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq fonts-dejavu-core >/dev/null && pip install -q pillow
      - name: Banned words (owner rule) - no art or arts center, no jamestownarts.com
        run: python3 tools/banned_words.py .
      - run: python3 tools/share_pages.py
      - name: Commit if anything changed
        run: |
          git add -A s img/share sitemap.xml feed.xml index.html data $(ls -d preview preview-light 2>/dev/null)
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="The Boston Rambler" -c user.email="douggarceau@users.noreply.github.com" commit -m "Update story share pages"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
